# Single SQLite database for the app and Solid Queue (Rails 8 defaults: WAL, busy timeout). IMMEDIATE transactions take the
# write lock up front, so concurrent writers wait on the busy timeout instead of failing with "database is locked".
development:
  adapter: sqlite3
  database: <%= ENV.fetch("BENCH_SQLITE", "storage/bench.sqlite3") %>
  pool: 80
  timeout: 10000
  default_transaction_mode: IMMEDIATE
