services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: pg
      POSTGRES_DB: rw
    ports:
      # Bound to loopback on a non-default port so it does not collide with other local PostgreSQL servers.
      - "127.0.0.1:55499:5432"
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on", "-c", "max_connections=300"]
