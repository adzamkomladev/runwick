# Queue library comparison (eng/bench-compare/ci/README.md). Manual only: Actions -> bench -> Run workflow.
# Every library x workload runs on its own fresh runner in parallel (28 jobs), each with its own PostgreSQL / Redis
# container, then one report job collects everything into the run summary and a downloadable HTML report.
name: bench
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Rounds per test (median is reported)
        default: "3"
      scale:
        description: Divide job counts and seconds by this (1 = full run; 10 = quick smoke run)
        default: "1"
      systems:
        description: Only these libraries, comma-separated (e.g. wolverine-redis,river); empty = all 14
        default: ""
      stores:
        description: "same-host layout only: which stores to run, comma-separated (postgres,redis,sqlite); empty = all three"
        default: ""
      layout:
        description: "per-library = one runner per library and workload (28 jobs); same-host = one runner per store, libraries one after another (Stage 1 baselines: normal workload, trace round, write floors)"
        default: per-library
        type: choice
        options: [per-library, same-host]
permissions:
  contents: read
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      systems: ${{ steps.pick.outputs.systems }}
      hostmatrix: ${{ steps.hosts.outputs.matrix }}
    steps:
      - id: hosts  # same-host layout: one job per chosen store, so an unchosen store costs no runner minutes
        env:
          STORES: ${{ inputs.stores }}
        run: |
          python3 -c "import json,os
          all=[{'store':'postgres','systems':'writefloor-pg,runwick-pg,river,pgboss,wolverine-pg,bullmq-dotnet-pg'},
               {'store':'redis','systems':'writefloor-redis,runwick-redis,runwick-redis-tuned,wolverine-redis,bullmq-dotnet-redis,bullmq'},
               {'store':'sqlite','systems':'writefloor-sqlite,runwick-sqlite,wolverine-sqlite,solidqueue'}]
          p=[x.strip() for x in os.environ['STORES'].split(',') if x.strip()]
          bad=[x for x in p if x not in [h['store'] for h in all]]; assert not bad, f'unknown stores: {bad}'
          print('matrix=' + json.dumps({'include': [h for h in all if not p or h['store'] in p]}))" >> "$GITHUB_OUTPUT"
      - id: pick
        env:
          ALL: runwick-pg,runwick-sqlite,runwick-redis,wolverine-pg,wolverine-sqlite,wolverine-redis,bullmq-dotnet-pg,bullmq-dotnet-redis,river,pgboss,solidqueue,bullmq,horizon,celery
          PICK: ${{ inputs.systems }}
        run: |
          python3 -c "import json,os; a=os.environ['ALL'].split(','); p=[x.strip() for x in os.environ['PICK'].split(',') if x.strip()]
          bad=[x for x in p if x not in a]; assert not bad, f'unknown systems: {bad}'
          print('systems=' + json.dumps(p or a))" >> "$GITHUB_OUTPUT"
  bench:
    needs: plan
    if: inputs.layout != 'same-host'
    name: ${{ matrix.system }} / ${{ matrix.workload }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(needs.plan.outputs.systems) }}
        workload: [normal, cpu]
    env:
      BC: eng/bench-compare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, so Runwick results carry `git describe`
      - name: Start PostgreSQL 18
        if: contains(fromJSON('["runwick-pg","river","pgboss","wolverine-pg","bullmq-dotnet-pg"]'), matrix.system)
        run: |
          docker run -d --name bench-pg -p 127.0.0.1:55499:5432 -e POSTGRES_PASSWORD=pg postgres:18
          until docker exec bench-pg pg_isready -U postgres -q; do sleep 1; done
      - name: Start Redis 8.2 (Runwick profile - AOF always, no RDB, noeviction - for every Redis library)
        if: contains(fromJSON('["runwick-redis","bullmq","horizon","celery","wolverine-redis","bullmq-dotnet-redis"]'), matrix.system)
        run: |
          docker run -d --name bench-redis -p 127.0.0.1:56392:6379 redis:8.2-alpine redis-server --appendonly yes --appendfsync always --no-appendfsync-on-rewrite no --maxmemory-policy noeviction --aof-load-truncated no --save ""
          until docker exec bench-redis redis-cli ping | grep -q PONG; do sleep 1; done

      - if: startsWith(matrix.system, 'runwick') || startsWith(matrix.system, 'wolverine') || startsWith(matrix.system, 'bullmq-dotnet')
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - if: startsWith(matrix.system, 'runwick')
        run: dotnet build tests/Runwick.Workloads/Runwick.Workloads.csproj -c Release
      - if: startsWith(matrix.system, 'wolverine')
        run: dotnet build $BC/wolverine/bench-wolverine.csproj -c Release
      - if: startsWith(matrix.system, 'bullmq-dotnet')
        run: dotnet build $BC/bullmq-dotnet/bench-bullmq-dotnet.csproj -c Release

      - if: matrix.system == 'river'
        uses: actions/setup-go@v5
        with:
          go-version-file: eng/bench-compare/river/go.mod
          cache-dependency-path: eng/bench-compare/river/go.sum
      - if: matrix.system == 'river'
        run: cd $BC/river && go build -o bench-river .

      - if: matrix.system == 'pgboss' || matrix.system == 'bullmq'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: matrix.system == 'pgboss' || matrix.system == 'bullmq'
        run: cd $BC/${{ matrix.system }} && npm ci --no-audit --no-fund

      - if: matrix.system == 'horizon'
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: redis
          tools: composer
      - if: matrix.system == 'horizon'
        run: COMPOSER_CMD=composer bash $BC/horizon/setup.sh

      - if: matrix.system == 'solidqueue'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - if: matrix.system == 'solidqueue'
        run: bash $BC/solidqueue/setup.sh

      - if: matrix.system == 'celery'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - if: matrix.system == 'celery'
        run: pip install -q -r $BC/celery/requirements.txt

      - name: Benchmark
        run: python3 $BC/ci/run.py --system ${{ matrix.system }} --workload ${{ matrix.workload }} --rounds ${{ inputs.rounds }} --scale ${{ inputs.scale }} --out results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.system }}-${{ matrix.workload }}
          path: results

  # Stage 1 baseline (docs/plans/queue-throughput-stage-1-plan.md): every library of one store on the SAME runner, one after another, order reversed on even
  # rounds, the store container recreated before each (run.py --fresh-stores). Targets such as "90% of River" need both on one host.
  samehost:
    needs: plan
    if: inputs.layout == 'same-host'
    name: same host / ${{ matrix.store }}
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.hostmatrix) }}
    env:
      BC: eng/bench-compare
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: the manifest compares src with v0.1.5
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tests/Runwick.Workloads/Runwick.Workloads.csproj -c Release
      - if: matrix.store != 'sqlite'
        run: |
          dotnet build $BC/wolverine/bench-wolverine.csproj -c Release
          dotnet build $BC/bullmq-dotnet/bench-bullmq-dotnet.csproj -c Release
      - if: matrix.store == 'sqlite'
        run: dotnet build $BC/wolverine/bench-wolverine.csproj -c Release
      - if: matrix.store == 'postgres'
        uses: actions/setup-go@v5
        with:
          go-version-file: eng/bench-compare/river/go.mod
          cache-dependency-path: eng/bench-compare/river/go.sum
      - if: matrix.store == 'postgres'
        run: cd $BC/river && go build -o bench-river .
      - if: matrix.store != 'sqlite'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - if: matrix.store == 'postgres'
        run: cd $BC/pgboss && npm ci --no-audit --no-fund
      - if: matrix.store == 'redis'
        run: cd $BC/bullmq && npm ci --no-audit --no-fund
      - if: matrix.store == 'sqlite'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - if: matrix.store == 'sqlite'
        run: bash $BC/solidqueue/setup.sh
      - name: Benchmark
        env:
          PICK: ${{ inputs.systems }}
        run: |
          systems="${{ matrix.systems }}"
          if [ -n "$PICK" ]; then systems=$(python3 -c "import os; p=[x.strip() for x in os.environ['PICK'].split(',')]; print(','.join(s for s in '$systems'.split(',') if s in p or s.startswith('writefloor-')))"); fi
          python3 $BC/ci/run.py --systems "$systems" --workload normal --rounds ${{ inputs.rounds }} --scale ${{ inputs.scale }} --fresh-stores --trace-round --out results
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-samehost-${{ matrix.store }}
          path: results

  report:
    needs: [bench, samehost]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          path: results
          merge-multiple: true
      - run: python3 eng/bench-compare/ci/report.py results report && cat report/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: bench-report
          path: report
